name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you build a .streamDeckPlugin from any branch or tag on demand:
  # Actions -> CI -> Run workflow -> pick a ref. The package lands in that
  # run's artifacts.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check & Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      artifact: ${{ steps.meta.outputs.artifact }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Resolve version and artifact name
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact=fxcommands-v${VERSION}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: dist/tf.josh.fxcommands.streamDeckPlugin
          if-no-files-found: error

  release:
    name: Release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Releasing is driven by "is this version already released?" rather than by
      # diffing against HEAD~1 — a push landing several commits at once would make
      # the version look unchanged and silently skip the release. Gating on the
      # release rather than the tag also means a run that failed after tagging can
      # simply be retried, instead of skipping and reporting success with nothing
      # published.
      - name: Check whether this version is already released
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.check.outputs.version }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG is already released — nothing to do."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.tag.outputs.new == 'true'
        with:
          name: ${{ needs.check.outputs.artifact }}
          path: dist

      # Fail loudly here rather than publishing a release with no plugin attached.
      - name: Verify the built plugin is present
        if: steps.tag.outputs.new == 'true'
        run: test -f dist/tf.josh.fxcommands.streamDeckPlugin

      - name: Create GitHub Release
        if: steps.tag.outputs.new == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # Creates the tag itself, so tag and release succeed or fail together
          # rather than leaving an orphaned tag that blocks a retry.
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/tf.josh.fxcommands.streamDeckPlugin
          fail_on_unmatched_files: true
          draft: true
