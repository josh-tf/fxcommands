name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you build a .streamDeckPlugin from any branch or tag on demand:
  # Actions -> CI -> Run workflow -> pick a ref. The package lands in that
  # run's artifacts.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check & Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      artifact: ${{ steps.meta.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Resolve version and artifact name
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact=fxcommands-v${VERSION}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: dist/tf.josh.fxcommands.streamDeckPlugin
          if-no-files-found: error

  release:
    name: Release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Releasing is driven by "is this version already tagged?" rather than by
      # diffing against HEAD~1 — a push landing several commits at once would
      # make the version look unchanged and silently skip the release.
      - name: Check whether this version is already released
        id: tag
        run: |
          TAG="v${{ needs.check.outputs.version }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists — nothing to release."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.new == 'true'
        with:
          name: ${{ needs.check.outputs.artifact }}
          path: dist

      - name: Create tag
        if: steps.tag.outputs.new == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.tag.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: dist/tf.josh.fxcommands.streamDeckPlugin
          draft: true
